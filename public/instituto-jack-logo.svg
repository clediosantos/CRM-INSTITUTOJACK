<svg viewBox="0 0 1000 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft glass reflection on letter J -->
    <linearGradient id="jGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3A3A" />
      <stop offset="48%" stop-color="#222222" />
      <stop offset="49%" stop-color="#000000" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <!-- Soft glass reflection on letter a -->
    <linearGradient id="aGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303030" />
      <stop offset="45%" stop-color="#181818" />
      <stop offset="46%" stop-color="#000000" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <!-- Soft glass reflection on letter c -->
    <linearGradient id="cGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303030" />
      <stop offset="45%" stop-color="#181818" />
      <stop offset="46%" stop-color="#000000" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
  </defs>

  <!-- 1. Wordmark: "INSTITUTO" in distinctive light chartreuse green (#8CC63F) sans-serif uppercase -->
  <text
    x="275"
    y="82"
    font-family="'Montserrat', 'Arial', sans-serif"
    font-size="64"
    font-weight="600"
    letter-spacing="14"
    fill="#8CC63F"
  >
    INSTITUTO
  </text>

  <!-- 2. The Letter 'J': Large monumental serif with curved bulbous terminal -->
  <!-- Top horizontal serif bar -->
  <path
    d="M75 14 L265 14 C265 14 263 32 245 35 C205 38 196 65 196 110 L196 355 C196 425 158 480 82 480 C18 480 0 425 0 380 C0 350 20 330 45 330 C68 330 84 348 84 372 C84 398 70 412 52 415 C62 432 85 440 108 440 C145 440 162 405 162 345 L162 108 C162 65 152 38 112 35 C95 32 93 14 75 14 Z"
    fill="#080808"
  />
  <!-- Subtle specular curve reflection on upper J -->
  <path
    d="M162 140 Q 185 145 196 148 L196 110 C196 85 190 60 178 45 Q 165 95 162 140 Z"
    fill="white"
    opacity="0.22"
  />

  <!-- 3. The Letter 'a': Lowercase elegant rounded serif/humanist shape -->
  <g transform="translate(225, 110)">
    <!-- Main stem and teardrop bowl -->
    <path
      d="M218 80 C205 70 178 64 148 64 C88 64 25 105 25 198 C25 292 90 338 152 338 C185 338 208 322 220 305 L220 332 L254 332 L254 135 C254 90 236 74 218 80 Z M150 298 C105 298 70 262 70 200 C70 138 105 102 150 102 C195 102 220 138 220 198 C220 260 195 298 150 298 Z"
      fill="#080808"
    />
    <!-- Top arch/hood of lowercase a -->
    <path
      d="M142 64 C205 64 254 98 254 158 L220 158 C220 120 185 98 142 98 C115 98 90 108 76 122 L55 96 C78 75 110 64 142 64 Z"
      fill="#080808"
    />
    <!-- Subtle reflection arch -->
    <path
      d="M72 175 Q 145 148 220 168 L220 150 Q 145 130 72 152 Z"
      fill="white"
      opacity="0.18"
    />
  </g>

  <!-- 4. The Letter 'c': Lowercase bold round curve with tapered terminals -->
  <g transform="translate(470, 110)">
    <path
      d="M230 148 L256 125 C232 90 195 64 138 64 C58 64 0 126 0 202 C0 280 58 338 142 338 C202 338 242 305 264 265 L225 240 C210 268 180 292 140 292 C90 292 48 255 48 202 C48 146 90 108 140 108 C182 108 212 128 230 148 Z"
      fill="#080808"
    />
    <!-- Subtle specular highlight on 'c' -->
    <path
      d="M12 175 Q 75 148 150 152 L155 135 Q 75 132 12 158 Z"
      fill="white"
      opacity="0.18"
    />
  </g>

  <!-- 5. Dynamic Organic Underline Wave in Light Green (#8CC63F) -->
  <!-- Swoosh sweeps gracefully beneath "Jac" -->
  <path
    d="M25 500 Q 130 455 240 472 Q 355 490 440 518 Q 470 522 492 516 Q 494 513 490 512 Q 390 488 285 464 Q 165 440 25 500 Z"
    fill="#8CC63F"
  />

  <!-- 6. The Scissor forming the letter 'K' with Light Green blades (#8CC63F) & Black outer arms -->
  <!-- Top tall straight Scissor Blade (forms the vertical/stem of the 'K') pointing skyward -->
  <g id="scissor-element">
    <!-- Top Sharp Blade pointing up into the air -->
    <path
      d="M778 2 C778 2 779 130 782 220 L776 345 L764 345 L778 2 Z"
      fill="#8CC63F"
    />
    <path
      d="M778 2 L802 245 L782 345 L776 345 Z"
      fill="#99D347"
    />

    <!-- Diagonal Shear Blade crossing down toward the handles -->
    <path
      d="M764 278 L724 375 L678 418 L640 448 L658 468 L695 432 L744 382 L772 345 Z"
      fill="#8CC63F"
    />

    <!-- Black Upper Diagonal Arm of the letter 'K' branching upwards and right -->
    <path
      d="M814 260 L945 42 C975 6 996 0 1000 0 C1000 0 970 45 918 122 L836 242 Z"
      fill="#080808"
    />

    <!-- Black Lower Diagonal Arm of the letter 'K' arching downwards to the right -->
    <path
      d="M814 260 Q 860 300 905 370 Q 945 435 960 450 L918 450 Q 880 395 832 315 Z"
      fill="#080808"
    />

    <!-- Scissor Pivot Screw / Fastener -->
    <circle cx="778" cy="345" r="7" fill="#8CC63F" stroke="#FFFFFF" stroke-width="2" />

    <!-- Left Handle Shank & Finger Loop in #8CC63F -->
    <g transform="translate(520, 395)">
      <!-- Shank from pivot -->
      <path
        d="M244 -50 L204 23 L162 60 L145 52 L120 72 L124 84 L142 80 L165 92 L182 72 Z"
        fill="#8CC63F"
      />
      <!-- Left Finger Ring Loop (angled) -->
      <!-- Outer circle/oval -->
      <path
        d="M170 82 C196 94 204 126 188 155 C172 184 140 196 114 182 C88 168 80 138 96 108 C112 79 144 68 170 82 Z M158 102 C140 92 118 100 107 120 C96 140 102 162 120 171 C138 180 160 173 171 152 C182 132 176 111 158 102 Z"
        fill="#8CC63F"
      />
      <!-- Finger Tang / rest bumper on left loop -->
      <path
        d="M86 112 C74 116 54 118 40 126 C36 130 38 138 46 138 C56 138 72 132 82 128 Z"
        fill="#8CC63F"
      />
    </g>

    <!-- Right Finger Loop (lower vertical ring) in #8CC63F -->
    <g transform="translate(750, 420)">
      <!-- Lower Shank -->
      <path
        d="M26 -75 L28 40 L45 40 L45 -75 Z"
        fill="#8CC63F"
      />
      <!-- Bottom Finger Ring Loop -->
      <path
        d="M60 55 C93 55 120 82 120 115 C120 148 93 175 60 175 C27 175 0 148 0 115 C0 82 27 55 60 55 Z M60 75 C38 75 20 93 20 115 C20 137 38 155 60 155 C82 155 100 137 100 115 C100 93 82 75 60 75 Z"
        fill="#8CC63F"
      />
    </g>
  </g>
</svg>
